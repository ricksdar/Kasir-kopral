    <div class="field"><label>Kolom Harga Grosir</label>
      <select onchange="setImportMapping('priceGrosir', this.value)">${opts(d.mapping.priceGrosir, true)}</select>
      <div class="muted" style="margin-top:5px; font-size:11.5px;">Kalau tidak ada kolom terpisah, boleh dikosongkan — Harga Grosir akan disamakan dengan Harga Ecer dan bisa diedit lagi nanti di menu Stok.</div>
    </div>
    <div class="field"><label>Kolom Stok</label>
      <select onchange="setImportMapping('stock', this.value)">${opts(d.mapping.stock, true)}</select>
    </div>
    ${d.mapping.name===-1 ? `<div class="change-box change-bad">Pilih dulu kolom Nama Produk.</div>` : (d.importMode==='overwrite' ? `
      <div class="card" style="margin:14px 0;">
        <div class="summary-row"><span>Total produk setelah ditimpa</span><span>${buildImportedProductList().length}</span></div>
      </div>
      <div class="change-box change-bad" style="margin-bottom:14px;">Produk yang tidak ada di file ini akan hilang dari katalog.</div>
      <button class="btn btn-primary" onclick="commitImport()">Timpa Sekarang</button>
    ` : `
      <div class="card" style="margin:14px 0;">
        <div class="summary-row"><span>Produk baru ditambahkan</span><span>${plan.toAdd.length}</span></div>
        <div class="summary-row"><span>Produk diperbarui (nama sama persis)</span><span>${plan.toUpdate.length}</span></div>
        ${plan.skipped>0 ? `<div class="summary-row"><span>Baris dilewati (nama kosong)</span><span>${plan.skipped}</span></div>` : ''}
      </div>
      ${(plan.toAdd.length + plan.toUpdate.length) > 0 ? `
      <div class="muted" style="margin-bottom:8px; font-size:12px;">Contoh data yang akan masuk:</div>
      <div class="card" style="margin-bottom:14px; font-size:12.5px;">
        ${plan.toAdd.slice(0,3).map(it=>`
          <div class="sdline"><span>${escapeHtml(it.name)} <span class="tag" style="padding:1px 7px;">baru</span></span><span>${it.category||'-'}${it.priceEcer!=null?' · Ecer '+rp(it.priceEcer):''}${it.priceGrosir!=null?' · Grosir '+rp(it.priceGrosir):''}${it.stock!=null?' · stok '+it.stock:''}</span></div>
        `).join('')}
        ${plan.toUpdate.slice(0,3).map(it=>`
          <div class="sdline"><span>${escapeHtml(it.name)}</span><span>${it.category||'-'}${it.priceEcer!=null?' · Ecer '+rp(it.priceEcer):''}${it.priceGrosir!=null?' · Grosir '+rp(it.priceGrosir):''}${it.stock!=null?' · +'+it.stock+' stok':''}</span></div>
        `).join('')}
      </div>` : ''}
      <button class="btn btn-primary" onclick="commitImport()">Import Sekarang</button>
    `)}
    <button class="btn btn-outline" style="margin-top:10px;" onclick="closeModal()">Batal</button>
  `;
}

function modalUserForm(u){
  const isNew = !u;
  return `
    <h3>${isNew ? 'Tambah Kasir' : 'Edit Kasir'}</h3>
    <div class="field"><label>Nama Kasir</label><input id="uf-name" value="${u?escapeAttr(u.name):''}" placeholder="Nama kasir"></div>
    <div class="field"><label>PIN (4 digit angka)${isNew?'':' — kosongkan kalau gak mau ganti'}</label><input id="uf-pin" inputmode="numeric" maxlength="4" value="" placeholder="${isNew?'0000':'••••'}"></div>
    <button class="btn btn-primary" onclick="saveUser(${isNew?'null':u.id})">Simpan</button>
    ${!isNew && users.length>1 ? `<button class="btn btn-danger" style="margin-top:10px;" onclick="deleteUser(${u.id})">${ICONS.trash} Hapus Kasir</button>` : ''}
    <button class="btn btn-outline" style="margin-top:10px;" onclick="closeModal()">Batal</button>
  `;
}
async function saveUser(id){
  if(!sb){ showAlert('Gak ada koneksi ke server, coba lagi kalau internet sudah nyambung.'); return; }
  const name = document.getElementById('uf-name').value.trim();
  const pin = document.getElementById('uf-pin').value.trim();
  if(!name){ showAlert('Nama kasir wajib diisi'); return; }
  if(id===null && !/^\d{4}$/.test(pin)){ showAlert('PIN harus 4 digit angka'); return; }
  if(pin && !/^\d{4}$/.test(pin)){ showAlert('PIN harus 4 digit angka'); return; }
  try{
    if(id===null){
      const { data: newId, error } = await sb.rpc('kk_add_staff', { p_name: name, p_pin: pin });
      if(error) throw error;
    } else {
      const { error } = await sb.rpc('kk_update_staff', { p_id: id, p_name: name, p_pin: pin || null });
      if(error) throw error;
      if(session && session.id===id) { session.name = name; persistSession(); }
    }
    await refreshStaffNames();
    closeModal();
    render();
  }catch(e){
    console.warn('Gagal simpan kasir:', e);
    showAlert('Gagal simpan: ' + (e && e.message ? e.message : e));
  }
}
function deleteUser(id){
  if(users.length<=1){ showAlert('Minimal harus ada 1 akun kasir.'); return; }
  if(!sb){ showAlert('Gak ada koneksi ke server, coba lagi kalau internet sudah nyambung.'); return; }
  askConfirm('Hapus akun kasir ini?', async function(){
    const wasSelf = session && session.id===id;
    try{
      const { error } = await sb.rpc('kk_delete_staff', { p_id: id });
      if(error) throw error;
      await refreshStaffNames();
      render();
      if(wasSelf) doLogout();
    }catch(e){
      console.warn('Gagal hapus kasir:', e);
      showAlert('Gagal hapus: ' + (e && e.message ? e.message : e));
    }
  });
}

/* ============ HELPERS ============ */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function afterRender(){ renderQrisQrIfNeeded(); }

/* ============ INIT ============ */
function showFatalError(err){
  try{
    const msg = (err && err.message) ? err.message : String(err);
    const stack = (err && err.stack) ? err.stack : '';
    document.body.innerHTML = `
      <div style="max-width:480px; margin:0 auto; padding:28px 22px; font-family:sans-serif; color:#241C10; background:#FBF3DE; min-height:100vh;">
        <h2 style="color:#C0392B; margin-bottom:10px;">Aplikasi gagal dimuat</h2>
        <p style="font-size:14px; line-height:1.6;">Terjadi error teknis saat membuka aplikasi. Silakan screenshot pesan di bawah ini dan kirim ke pembuat aplikasi supaya bisa diperbaiki.</p>
        <div style="background:#fff; border:1px solid #eee; border-radius:10px; padding:14px; margin-top:14px; font-family:monospace; font-size:12.5px; white-space:pre-wrap; word-break:break-word;">${String(msg).replace(/</g,'&lt;')}</div>
        <details style="margin-top:12px; font-size:11.5px; color:#5B4E37;"><summary>Detail teknis</summary><pre style="white-space:pre-wrap; word-break:break-word;">${String(stack).replace(/</g,'&lt;')}</pre></details>
        <p style="font-size:12.5px; color:#5B4E37; margin-top:16px;">Coba juga: buka file ini pakai aplikasi Chrome (bukan browser bawaan lain), pastikan file tidak rusak saat diunduh, dan coba di HP/koneksi lain.</p>
      </div>`;
  }catch(e2){ /* last resort: leave whatever is on screen */ }
}
window.onerror = function(message, source, lineno, colno, error){
  showFatalError(error || message);
  return true;
};
try{
  render();
  if(SYNC_ENABLED){ syncPull().then(subscribeRealtime); }
}catch(err){
  showFatalError(err);
}
</script>
</body>
</html>
