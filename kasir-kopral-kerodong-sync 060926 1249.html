<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Kasir Kopral Kerodong</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1F4436">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  :root{
    --cream:#FBF3DE; --paper:#FFFFFF; --ink:#241C10; --ink-soft:#5B4E37;
    --gold:#F5A623; --gold-deep:#C97A0E;
    --forest:#1F4436; --forest-light:#2E5C48;
    --whatsapp:#25D366; --whatsapp-deep:#1DA851;
    --danger:#C0392B; --danger-bg:#FBE7E4;
    --line:rgba(36,28,16,0.12); --radius:16px; --shadow:0 8px 22px rgba(36,28,16,0.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Inter',sans-serif; background:var(--forest); color:var(--ink);
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif; font-weight:700; margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,select{font-family:inherit;}
  a{color:inherit;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--cream); position:relative; display:flex; flex-direction:column;}

  /* Top bar */
  .topbar{
    background:var(--forest); color:#fff; padding:16px 18px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:30;
  }
  .topbar .title{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px;}
  .topbar .sub{font-size:12px; color:rgba(255,255,255,0.7); margin-top:1px;}
  .topbar-brand{display:flex; align-items:center; gap:10px;}
  .topbar-logo{height:32px; width:auto; flex:none;}
  .login-logo{height:56px; width:auto; margin:0 auto 14px; display:block;}
  .icon-btn{
    background:rgba(255,255,255,0.12); border:none; color:#fff; width:38px; height:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn svg{width:19px; height:19px;}

  .content{flex:1; padding:16px 16px 96px; overflow-y:auto;}

  /* Bottom nav */
  .bottomnav{
    position:sticky; bottom:0; z-index:30; background:var(--paper); border-top:1px solid var(--line);
    display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .navbtn{
    flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 4px; border-radius:12px; color:var(--ink-soft); font-size:11px; font-weight:700;
  }
  .navbtn.active{color:var(--gold-deep); background:rgba(245,166,35,0.12);}
  .navbtn svg{width:20px; height:20px;}

  /* Generic */
  .card{background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--line); padding:16px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
    padding:14px 18px; border-radius:14px; font-weight:700; font-size:15px; border:2px solid transparent;
    transition:transform .1s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.4; pointer-events:none;}
  .btn-primary{background:var(--whatsapp); color:#fff;}
  .btn-gold{background:var(--gold); color:var(--ink);}
  .btn-outline{background:var(--paper); border-color:var(--line); color:var(--ink);}
  .btn-danger{background:var(--danger-bg); color:var(--danger); border-color:transparent;}
  .btn-dark{background:var(--forest); color:#fff;}
  .btn svg{width:18px; height:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
  .field input, .field select{
    width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); font-size:15px; background:#fff; color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--gold-deep);}
  .field input[type=file]{padding:9px 10px; font-size:13px;}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}
  .muted{color:var(--ink-soft); font-size:13px;}
  .tag{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:rgba(31,68,54,0.09); color:var(--forest);}
  .tag-danger{background:var(--danger-bg); color:var(--danger);}
  .empty{text-align:center; padding:40px 16px; color:var(--ink-soft);}

  /* Login */
  .login-wrap{padding:40px 22px; display:flex; flex-direction:column; min-height:100vh; justify-content:center;}
  .login-title{text-align:center; margin-bottom:28px;}
  .login-title h1{font-size:24px; color:var(--forest);}
  .login-title .muted{margin-top:4px;}
  .user-btn{
    width:100%; text-align:left; background:var(--paper); border:1.5px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:10px; display:flex; align-items:center; gap:12px; font-size:16px; font-weight:700;
  }
  .avatar{width:40px; height:40px; border-radius:50%; background:var(--gold); color:var(--ink); display:flex; align-items:center; justify-content:center; font-family:'Baloo 2'; font-weight:700; flex:none;}

  /* PIN pad */
  .pin-dots{display:flex; justify-content:center; gap:14px; margin:22px 0;}
  .pin-dot{width:16px; height:16px; border-radius:50%; border:2px solid var(--forest);}
  .pin-dot.filled{background:var(--forest);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:0 auto;}
  .key{
    aspect-ratio:1; border-radius:50%; border:none; background:var(--paper); box-shadow:var(--shadow);
    font-size:22px; font-weight:700; color:var(--ink); display:flex; align-items:center; justify-content:center;
  }
  .key:active{background:var(--cream);}
  .pin-error{color:var(--danger); text-align:center; font-weight:700; font-size:13px; height:18px; margin-bottom:4px;}

  /* POS */
  .search-wrap{position:relative; margin-bottom:12px;}
  .search-wrap svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--ink-soft);}
  .search-wrap input{padding-left:38px;}
  .chips{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
  .chip{
    flex:none; padding:8px 15px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper);
    font-size:13px; font-weight:700; color:var(--ink-soft);
  }
  .chip.active{background:var(--forest); color:#fff; border-color:var(--forest);}
  .product-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .product-card{
    background:var(--paper); border-radius:14px; border:1px solid var(--line); padding:12px; text-align:left;
    display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow);
  }
  .product-card .pname{font-weight:700; font-size:14px; line-height:1.25; min-height:36px;}
  .product-card .pprice{font-family:'Baloo 2'; color:var(--gold-deep); font-weight:700; font-size:15px;}
  .product-card .pgrosir{font-size:10.5px; color:var(--ink-soft); margin-top:-4px;}
  .product-card .pmeta{display:flex; justify-content:space-between; align-items:center; font-size:11px;}
  .product-card.out-of-stock{background:var(--danger-bg); border-color:var(--danger);}
  .product-card.out-of-stock .pname{color:var(--danger);}
  .product-card.out-of-stock .pprice{color:var(--danger); opacity:0.7;}
  .cart-fab{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; z-index:35;
    background:var(--forest); color:#fff; padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:space-between; box-shadow:0 -6px 20px rgba(0,0,0,0.18);
  }
  .cart-fab .info{font-size:12.5px; color:rgba(255,255,255,0.75);}
  .cart-fab .total{font-family:'Baloo 2'; font-size:18px; font-weight:700;}
  .cart-fab .go{background:var(--gold); color:var(--ink); border:none; padding:12px 20px; border-radius:12px; font-weight:800; font-size:14px;}

  /* Cart list */
  .cart-item{display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
  .cart-item:last-child{border-bottom:none;}
  .cart-item .ci-name{font-weight:700; font-size:14px;}
  .cart-item .ci-price{font-size:12.5px; color:var(--ink-soft);}
  .stepper{display:flex; align-items:center; gap:8px;}
  .stepper button{
    width:28px; height:28px; border-radius:8px; border:1.5px solid var(--line); background:var(--paper); font-weight:800; font-size:16px;
    display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  .stepper .qty{min-width:20px; text-align:center; font-weight:700;}
  .ci-remove{color:var(--danger); background:none; border:none; font-size:12px; font-weight:700; margin-left:4px;}
  .summary-row{display:flex; justify-content:space-between; padding:6px 0; font-size:14px;}
  .summary-row.total{font-family:'Baloo 2'; font-size:19px; font-weight:700; border-top:1.5px dashed var(--line); margin-top:6px; padding-top:12px;}
  .change-box{border-radius:12px; padding:12px 14px; margin-top:10px; font-weight:700; text-align:center;}
  .change-ok{background:rgba(37,211,102,0.14); color:var(--whatsapp-deep);}
  .change-bad{background:var(--danger-bg); color:var(--danger);}

  /* Receipt */
  .receipt{
    background:#fff; border-radius:14px; padding:20px; border:1.5px dashed var(--line); font-family:'Inter',monospace;
  }
  .receipt h3{text-align:center; font-family:'Baloo 2';}
  .receipt .rline{display:flex; justify-content:space-between; font-size:13px; margin:3px 0;}
  .receipt hr{border:none; border-top:1.5px dashed var(--line); margin:10px 0;}

  /* Modal */
  .modal-bg{
    position:fixed; inset:0; background:rgba(36,28,16,0.5); display:flex; align-items:flex-end; z-index:60;
  }
  .modal-bg.center{align-items:center; padding:20px;}
  .modal{
    background:var(--paper); width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0; padding:20px;
    max-height:88vh; overflow-y:auto;
  }
  .modal-bg.center .modal{border-radius:18px;}
  .modal h3{margin-bottom:16px;}

  /* Stock list */
  .stock-row{display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line);}
  .stock-row:last-child{border-bottom:none;}
  .stock-row .sname{font-weight:700; font-size:14px;}
  .stock-row .smeta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .stock-row .sright{text-align:right;}
  .stock-row .sprice{font-family:'Baloo 2'; font-weight:700; color:var(--gold-deep);}
  .cat-row{padding:12px 0; border-bottom:1px solid var(--line);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row .cat-top{margin-bottom:9px;}
  .cat-actions{display:flex; gap:8px;}
  .cat-actions .icon-btn{width:36px; height:36px;}
  .cat-actions .icon-btn:disabled{pointer-events:none;}

  /* History */
  .sale-card{margin-bottom:10px;}
  .sale-head{display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .sale-head .stime{font-weight:700; font-size:14px;}
  .sale-head .skasir{font-size:12px; color:var(--ink-soft);}
  .sale-head .stotal{font-family:'Baloo 2'; font-weight:700; color:var(--forest);}
  .sale-detail{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:13px;}
  .sale-detail .sdline{display:flex; justify-content:space-between; margin:3px 0;}

  .section-title{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); margin:18px 0 10px;}
  .section-title:first-child{margin-top:0;}
  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:100px; z-index:80;
    background:var(--ink); color:#fff; padding:12px 18px; border-radius:12px; font-size:13.5px; font-weight:700;
    box-shadow:var(--shadow); max-width:86%; text-align:center;
  }
</style>
</head>

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ console.warn('Gagal menyimpan data (' + key + '):', e); }
}

// --- konversi baris Supabase <-> object lokal ---
function productRowToLocal(row){ return Object.assign({}, row.data, { id: row.id, stock: row.stock }); }
function productToRow(p){ const {id, stock, ...data} = p; return { id, stock: stock||0, data, updated_at: new Date().toISOString() }; }
function saleRowToLocal(row){ return row.data; }
function saleToRow(s){ return { id: s.id, data: s, created_at: s.datetime || new Date().toISOString() }; }
function expenseRowToLocal(row){ return row.data; }
function expenseToRow(e){ return { id: e.id, data: e, created_at: e.datetime || new Date().toISOString() }; }

async function syncPull(){
  if(!sb) return;
  setSyncStatus('connecting');
  try{
    const [storeRes, productsRes, salesRes, expensesRes] = await Promise.all([
      sb.from(STORE_TABLE).select('id,value'),
      sb.from(PRODUCTS_TABLE).select('id,stock,data'),
      sb.from(SALES_TABLE).select('id,data'),
      sb.from(EXPENSES_TABLE).select('id,data'),
    ]);
    if(storeRes.error) throw storeRes.error;
    if(productsRes.error) throw productsRes.error;
    if(salesRes.error) throw salesRes.error;
    if(expensesRes.error) throw expensesRes.error;
    await refreshStaffNames();

    const storeMap = {};
    (storeRes.data || []).forEach(row => { storeMap[row.id] = row.value; });
    if(storeMap.category_order){ categoryOrder = storeMap.category_order; saveJSON('kk_category_order', categoryOrder); }

    if((productsRes.data || []).length){
      products = productsRes.data.map(productRowToLocal);
      saveJSON('kk_products', products);
    }
    if((salesRes.data || []).length){
      sales = salesRes.data.map(saleRowToLocal).sort((a,b) => new Date(b.datetime) - new Date(a.datetime));
      saveJSON('kk_sales', sales);
    }
    if((expensesRes.data || []).length){
      expenses = expensesRes.data.map(expenseRowToLocal).sort((a,b) => new Date(b.datetime) - new Date(a.datetime));
      saveJSON('kk_expenses', expenses);
    }

  }catch(e){
    console.warn('Sync pull gagal, pakai data lokal dulu:', e);
    setSyncStatus('error');
  }
  render();
}

function syncPush(key, value){
  // dipakai untuk data blob (users, category_order) saja
  if(!sb) return;
  clearTimeout(syncPushTimer[key]);
  syncPushTimer[key] = setTimeout(async () => {
    try{
      const { error } = await sb.from(STORE_TABLE).upsert({ id: key, value, updated_at: new Date().toISOString() });
      if(error) throw error;
      setSyncStatus('online');
    }catch(e){
      console.warn('Sync push gagal (' + key + '):', e);
      setSyncStatus('error');
    }
  }, 150);
}

function subscribeRealtime(){
  if(!sb) return;
  sb.channel('kk_store_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: STORE_TABLE }, (payload) => {
      const row = payload.new;
      if(!row || !row.id) return;
      // Baris 'users' sudah diblok RLS dari sisi client (lihat kk_verify_staff_pin
      // dkk) -- gak akan pernah nyampe ke sini lagi, jadi gak perlu ditangani.
      if(row.id === 'category_order'){ categoryOrder = row.value; saveJSON('kk_category_order', categoryOrder); }
      else return;
      render();
    })
    .subscribe((status) => { if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setSyncStatus('error'); });

  sb.channel('kk_products_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: PRODUCTS_TABLE }, (payload) => {
      if(payload.eventType === 'DELETE'){
        products = products.filter(p => p.id !== payload.old.id);
      }else{
        const local = productRowToLocal(payload.new);
        const idx = products.findIndex(p => p.id === local.id);
        if(idx === -1) products.push(local); else products[idx] = local;
      }
      saveJSON('kk_products', products);
      render();
    })
    .subscribe();

  sb.channel('kk_sales_changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: SALES_TABLE }, (payload) => {
      const local = saleRowToLocal(payload.new);
      if(!sales.find(s => s.id === local.id)){
        sales.unshift(local);
        sales.sort((a,b) => new Date(b.datetime) - new Date(a.datetime));
        saveJSON('kk_sales', sales);
        render();
      }
    })
    .subscribe();

  sb.channel('kk_expenses_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: EXPENSES_TABLE }, (payload) => {
      if(payload.eventType === 'DELETE'){
        expenses = expenses.filter(e => e.id !== payload.old.id);
      }else{
        const local = expenseRowToLocal(payload.new);
        if(!expenses.find(e => e.id === local.id)){
          expenses.unshift(local);
          expenses.sort((a,b) => new Date(b.datetime) - new Date(a.datetime));
        }
      }
      saveJSON('kk_expenses', expenses);
      render();
    })
    .subscribe();
}

/* ============ QRIS DINAMIS (isi nominal ke QR statis) ============
   String QRIS statis (hasil scan QR fisik Cabang 3, BCA) diubah jadi versi
   dinamis dengan nominal ke-embed, sesuai format standar EMVCo/QRIS:
   - tag 01 (Point of Initiation) diganti dari "11" (statis) ke "12" (dinamis)
   - tag 54 (nominal transaksi) disisipkan setelah tag 53 (mata uang)
   - CRC (tag 63) dihitung ulang (CRC16/CCITT-FALSE, poly 0x1021, init 0xFFFF)
   Cuma buat Cabang 3 dulu -- kalau cabang lain mau fitur ini juga, perlu QRIS
   statis masing-masing cabang (NMID beda per cabang/merchant). */
const QRIS_STATIC_PAYLOAD = '00020101021126650013ID.CO.BCA.WWW011893600014000115342802150008850011534280303UKE51440014ID.CO.QRIS.WWW0215ID10210659706470303UKE5204599553033605802ID5920KOPRAL CABANG 3 TOKO6013JAKARTA TIMUR61051389062070703A01630462F5';
function qrisTlvParse(payload){
  const fields = [];
  let i = 0;
  while(i < payload.length){
    const tag = payload.substr(i, 2);
    const len = parseInt(payload.substr(i+2, 2), 10);
    const value = payload.substr(i+4, len);
    fields.push({tag, value});
    i += 4 + len;
  }
  return fields;
}
function qrisTlvBuild(fields){
  return fields.map(f => f.tag + String(f.value.length).padStart(2,'0') + f.value).join('');
}
function qrisCrc16(str){
  let crc = 0xFFFF;
  for(let i=0; i<str.length; i++){
    crc ^= (str.charCodeAt(i) << 8);
    for(let j=0; j<8; j++){
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
    }
  }
  return crc & 0xFFFF;
}
function buildDynamicQris(staticPayload, amount){
  let fields = qrisTlvParse(staticPayload).filter(f => f.tag !== '63' && f.tag !== '54');
  fields = fields.map(f => f.tag === '01' ? {tag:'01', value:'12'} : f);
  const amountStr = String(Math.round(amount));
  const insertAfterTag = fields.some(f=>f.tag==='53') ? '53' : '52';
  const idx = fields.findIndex(f=>f.tag===insertAfterTag);
  fields.splice(idx+1, 0, {tag:'54', value:amountStr});
  const bodyWithCrcTag = qrisTlvBuild(fields) + '6304';
  const crc = qrisCrc16(bodyWithCrcTag).toString(16).toUpperCase().padStart(4,'0');
  return bodyWithCrcTag + crc;
}
// Dipanggil dari afterRender() -- gambar ulang QR cuma kalau nominalnya
// berubah, biar gak nge-render ulang tiap ketikan (mis. pas isi diskon).
let __lastDrawnQrisAmount = null;
function renderQrisQrIfNeeded(){
  const box = document.getElementById('qris-qr-canvas');
  if(!box) { __lastDrawnQrisAmount = null; return; }
  const amount = box.getAttribute('data-amount');
  if(amount === String(__lastDrawnQrisAmount)) return;
  __lastDrawnQrisAmount = amount;
  if(typeof QRCode === 'undefined'){
    box.parentElement.innerHTML = '<div class="muted" style="text-align:center; font-size:12px;">Gagal memuat QR (perlu koneksi internet). Pembayaran QRIS tetap bisa lewat aplikasi bank/e-wallet manual.</div>';
    return;
  }
  const payload = buildDynamicQris(QRIS_STATIC_PAYLOAD, Number(amount)||0);
  QRCode.toCanvas(box, payload, { width: 220, margin: 1 }, function(err){
    if(err) console.warn('Gagal generate QR QRIS:', err);
  });
}

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length<=1 && String(r[0]||'').trim()===''));
}
function guessColumn(headers, regex){
  for(let i=0;i<headers.length;i++){ if(regex.test(String(headers[i]||'').trim())) return i; }
  return -1;
}
function parseNumberLoose(val){
  const digits = String(val==null?'':val).replace(/[^\d]/g,'');
  return digits ? parseInt(digits,10) : 0;
}
function extractSheetIdAndGid(url){
  const m = String(url||'').match(/\/d\/([a-zA-Z0-9-_]+)/);
  if(!m) return null;
  const gidMatch = String(url).match(/[?#&]gid=(\d+)/);
  return { id: m[1], gid: gidMatch ? gidMatch[1] : '0' };
}
function loadScriptOnce(src){
  window.__loadedScripts = window.__loadedScripts || {};
  if(window.__loadedScripts[src]) return window.__loadedScripts[src];
  const p = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('Gagal memuat pembaca file Excel. Cek koneksi internet lalu coba lagi.'));
    document.head.appendChild(s);
  });
  window.__loadedScripts[src] = p;
  return p;
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) + ' ' +
         d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
}
function localDateStr(d){
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayStr(){ return localDateStr(new Date()); }

/* ============ RENDER ROOT ============ */
function render(){
  const app = document.getElementById('app');

  // remember which input (if any) was focused, and its cursor position, so
  // re-rendering the whole page doesn't kick the user out mid-typing
  const active = document.activeElement;
  let savedId = null, selStart = null, selEnd = null;
  if(active && active.id && app.contains(active)){
    savedId = active.id;
    if(typeof active.selectionStart === 'number'){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  }

  if(state.screen === 'login'){
    app.innerHTML = viewLogin() + (state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : '');
    restoreFocus(); return;
  }
  if(state.screen === 'pin'){
    app.innerHTML = viewPin() + (state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : '');
    restoreFocus(); return;
  }

  let body = '';
  if(state.screen === 'pos') body = viewPOS();
  else if(state.screen === 'cart') body = viewCart();
  else if(state.screen === 'receipt') body = viewReceipt();
  else if(state.screen === 'riwayat') body = viewRiwayat();
  else if(state.screen === 'stok') body = viewStok();
  else if(state.screen === 'pengaturan') body = viewPengaturan();

  app.innerHTML = `
    ${topbar()}
    <div class="content">${body}</div>
    ${state.screen==='pos' ? cartFab() : ''}
    ${bottomNav()}
    ${state.modal ? modalView() : ''}
    ${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ''}
  `;
  afterRender();
  restoreFocus();

  function restoreFocus(){
    if(!savedId) return;
    const el = document.getElementById(savedId);
    if(!el) return;
    el.focus();
    if(typeof el.setSelectionRange === 'function'){
      try{
        if(selStart !== null){ el.setSelectionRange(selStart, selEnd); }
        else if(typeof el.value === 'string'){ el.setSelectionRange(el.value.length, el.value.length); }
      }catch(e){}
    }
  }
}

function cartItemUnitPrice(item){
  if(!item.productId) return item.price || 0; // barang manual: harga tetap

  return item.qty >= GROSIR_MIN_QTY ? p.priceGrosir : p.priceEcer;
}
function addToCart(productId){
  const p = products.find(x=>x.id===productId);
  if(!p) return;
  const existing = state.cart.find(c=>c.productId===productId);
  if(existing){
    if(existing.qty + 1 > p.stock){
      showInfoPopup('Stok "' + p.name + '" tinggal ' + p.stock + '. Tidak bisa menambah lebih dari itu.');
      return;
    }
    existing.qty += 1;
  } else {
    state.cart.push({productId:p.id, name:p.name, qty:1, stock:p.stock});
  }
  render();
}

function cartQty(i, delta){
  const item = state.cart[i];
  if(delta > 0 && item.productId){
    const p = products.find(x=>x.id===item.productId);
    const maxStock = p ? p.stock : item.stock;
    if(maxStock != null && item.qty + 1 > maxStock){
      showInfoPopup('Stok "' + item.name + '" tinggal ' + maxStock + '. Tidak bisa menambah lebih dari itu.');
      return;

  }
  item.qty += delta;
  if(item.qty<=0) state.cart.splice(i,1);
  render();
}

async function finishSale(){
  if(state.processingSale) return;
  const subtotal = cartSubtotal();
  const total = Math.max(0, subtotal - (Number(state.discount)||0));
  if(total<=0){ showAlert('Total transaksi masih Rp0. Cek harga produk atau isi keranjang dulu.'); return; }
  const method = state.paymentMethod || 'cash';
  const cash = method === 'cash' ? (Number(state.cash)||0) : total;
  if(method === 'cash' && cash < total){ showAlert('Uang diterima masih kurang dari total. Lengkapi dulu sebelum menyelesaikan transaksi.'); return; }
  state.processingSale = true;
  const cartSnapshot = state.cart;
  const sale = {
    id: nextId(sales),
    datetime: new Date().toISOString(),
    kasir: session.name,
    items: cartSnapshot.map(c=>{ const price = cartItemUnitPrice(c); return {productId:c.productId, name:c.name, price, qty:c.qty, subtotal:price*c.qty}; }),
    discount: Number(state.discount)||0,
    subtotal, total, cash, change: cash-total,
    paymentMethod: method,
    channel: 'store',
  };
  sales.unshift(sale);
  persistSales();
  // Kurangi stok. Kalau sync aktif, pakai fungsi database ATOMIK supaya
  // hasilnya tetap benar walau ada kasir lain checkout produk yang sama
  // di detik yang bersamaan (server yang menentukan urutan, bukan HP).
  for(const c of cartSnapshot){
    if(!c.productId) continue;
    const p = products.find(x=>x.id===c.productId);
    if(!p) continue;
    let newStock = null;
    if(SYNC_ENABLED) newStock = await syncDecrementStock(c.productId, c.qty);
    if(newStock === null) newStock = Math.max(0, p.stock - c.qty); // fallback: offline / gagal sync
    p.stock = newStock;
  }
  saveJSON('kk_products', products); // stok sudah pasti benar (dari server kalau online); tinggal simpan lokal, tanpa upsert ulang berlebihan
  state.processingSale = false;
  state.lastSale = sale;
  state.cart = []; state.discount = 0; state.cash = ''; state.paymentMethod = 'cash';
  setScreen('receipt');
}

function wrapPlainText(text, maxChars){
  const words = String(text).split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w=>{
    const test = cur ? cur + ' ' + w : w;
    if(test.length > maxChars && cur){ lines.push(cur); cur = w; } else { cur = test; }
  });
  if(cur) lines.push(cur);
  return lines;
}
const RECEIPT_LINE_WIDTH = 32; // umum untuk printer thermal 58mm font normal
function receiptText(sale){
  const W = RECEIPT_LINE_WIDTH;
  let t = 'KOPRAL KERODONG\n' + fmtDate(sale.datetime) + '\nKasir: ' + sale.kasir + '\n' + '-'.repeat(W) + '\n';
  sale.items.forEach(it=>{

    t += '  ' + it.qty + ' x ' + rp(it.price) + ' = ' + rp(it.subtotal) + '\n';
  });
  t += '-'.repeat(W) + '\n';
  t += 'Subtotal: ' + rp(sale.subtotal) + '\n';
  if(sale.discount>0) t += 'Diskon: -' + rp(sale.discount) + '\n';
  t += 'Total: ' + rp(sale.total) + '\n';

    t += 'Kembalian: ' + rp(sale.change) + '\n';
  } else {
    t += 'Dibayar: ' + rp(sale.cash) + '\n';

  if(sale.channel === 'online'){
    t += '-'.repeat(W) + '\n';
    t += 'PESANAN ONLINE\n';

    if(sale.customerPhone) t += 'No. WA: ' + sale.customerPhone + '\n';
    if(sale.customerAddress) wrapPlainText('Alamat: ' + sale.customerAddress, W).forEach(l => t += l + '\n');
    if(sale.customerNote) wrapPlainText('Catatan: ' + sale.customerNote, W).forEach(l => t += l + '\n');
  }
  t += '-'.repeat(W) + '\nTerima kasih sudah belanja!\n';
  t += 'Shopee: kopralkerodong\n';
  t += 'WA: 0812-8956-9066\n';

/* ============ STRUK SEBAGAI GAMBAR (PNG) ============ */
function wrapCanvasText(ctx, text, font, maxWidth){
  ctx.font = font;
  const words = String(text).split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w=>{
    const test = cur ? cur + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && cur){
      lines.push(cur); cur = w;
    } else { cur = test; }
  });
  if(cur) lines.push(cur);
  return lines;
}
let __logoImagePromise = null;
function loadLogoImage(){
  if(__logoImagePromise) return __logoImagePromise;
  __logoImagePromise = new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>resolve(null); // gagal load logo bukan alasan gagalkan seluruh struk
    img.src = LOGO_DATA_URI;
  });
  return __logoImagePromise;
}
// Satu-satunya fungsi pembuat gambar struk sekarang -- sengaja dibuat
// SAMA PERSIS dengan yang dicetak fisik via Bluetooth/USB: teksnya diambil
// dari receiptText() yang sama (bukan desain/tata-letak terpisah), logo
// dipaksa jadi siluet hitam pekat kayak hasil cetak beneran, font monospace
// rata kiri kayak kertas struk asli. Dipakai oleh downloadReceiptImage(),
// shareReceiptWA(), dan sendReceiptToWhatsAppNumber().
async function buildReceiptCanvas(sale){
  const W = 384, PAD = 20;
  const contentW = W - PAD*2;
  const FONT_BODY = '13px monospace';
  const FONT_HEADER = 'bold 17px monospace';
  const LINE_H = 18;

  const logoImg = await loadLogoImage();
  const lines = receiptText(sale).split('\n');
  const headerLine = lines[0]; // "KOPRAL KERODONG"
  const bodyLines = lines.slice(1);

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = 10;
  const ctx = canvas.getContext('2d');

  // Bungkus tiap baris body ke lebar canvas (jaga-jaga kalau ada baris yang
  // kepanjangan, walau receiptText() sendiri sudah dibungkus ke 32 kolom).
  const wrapped = [];
  bodyLines.forEach(l=>{
    if(l === ''){ wrapped.push(''); return; }
    wrapCanvasText(ctx, l, FONT_BODY, contentW).forEach(w=>wrapped.push(w));
  });

  let y = PAD;
  let logoBox = null;
  if(logoImg){
    const logoW = Math.round(W * 0.55);
    const logoH = Math.round(logoW * (logoImg.height / logoImg.width));
    // Siluet hitam logo HARUS dibikin di canvas terpisah yang masih transparan
    // dulu -- kalau langsung di canvas struk utama, background putihnya udah
    // opaque duluan, jadi trik source-atop malah nge-hitamin satu kotak penuh
    // (itu penyebab logo jadi kotak hitam solid, bukan bentuk logo aslinya).
    const maskCanvas = document.createElement('canvas');
    maskCanvas.width = logoW; maskCanvas.height = logoH;
    const mctx = maskCanvas.getContext('2d');
    mctx.drawImage(logoImg, 0, 0, logoW, logoH);
    mctx.globalCompositeOperation = 'source-atop';
    mctx.fillStyle = '#000000';
    mctx.fillRect(0, 0, logoW, logoH);
    logoBox = { x: Math.round((W-logoW)/2), y, w: logoW, h: logoH, silhouette: maskCanvas };
    y += logoH + 12;
  }
  const headerY = y; y += 24;
  const bodyStartY = y; y += wrapped.length * LINE_H;
  const totalHeight = y + PAD;

  canvas.width = W; canvas.height = totalHeight; // resize clears context, isi ulang di bawah
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, W, totalHeight);

  if(logoBox){
    ctx.drawImage(logoBox.silhouette, logoBox.x, logoBox.y, logoBox.w, logoBox.h);
  }

  ctx.fillStyle = '#000000';
  ctx.textAlign = 'center';
  ctx.font = FONT_HEADER;
  ctx.fillText(headerLine, W/2, headerY);

  ctx.textAlign = 'left';
  ctx.font = FONT_BODY;
  let cy = bodyStartY;
  wrapped.forEach(l=>{ ctx.fillText(l, PAD, cy); cy += LINE_H; });

  return canvas;
}
function receiptCanvasToBlob(canvas){
  return new Promise(resolve=>{ canvas.toBlob(blob=>resolve(blob), 'image/png'); });
}

/* ============ CETAK KE PRINTER (Bluetooth / USB / Sistem) ============ */
const ESC_POS_INIT = [0x1B, 0x40];        // ESC @  - reset printer
const ESC_POS_CUT   = [0x1D, 0x56, 0x42, 0x00]; // GS V B 0 - full cut (feed dulu baru potong)
function buildEscPosBytes(text){
  const encoder = new TextEncoder();
  const body = encoder.encode(text + '\n\n\n');
  const bytes = new Uint8Array(ESC_POS_INIT.length + body.length + ESC_POS_CUT.length);
  bytes.set(ESC_POS_INIT, 0);
  bytes.set(body, ESC_POS_INIT.length);
  bytes.set(ESC_POS_CUT, ESC_POS_INIT.length + body.length);
  return bytes;
}
// Format teks pakai perintah ESC/POS standar (bukan gambar/raster) -- font
// dirender native oleh printer sendiri, jadi selalu tajam & konsisten di
// printer thermal murah manapun. Raster gampang jadi noise/blur kalau
// resolusi printer pas-pasan (itu penyebab logo & teks kecil jadi buram).
const ESC_ALIGN_LEFT   = [0x1B, 0x61, 0x00]; // ESC a 0
const ESC_ALIGN_CENTER = [0x1B, 0x61, 0x01]; // ESC a 1
const ESC_BOLD_ON      = [0x1B, 0x45, 0x01]; // ESC E 1
const ESC_BOLD_OFF     = [0x1B, 0x45, 0x00]; // ESC E 0
const GS_SIZE_NORMAL   = [0x1D, 0x21, 0x00]; // GS ! - ukuran normal
function concatBytes(arrays){
  const total = arrays.reduce((s,a)=>s+a.length, 0);
  const out = new Uint8Array(total);
  let o = 0;
  arrays.forEach(a=>{ out.set(a instanceof Uint8Array ? a : new Uint8Array(a), o); o += a.length; });
  return out;
}

function base64ToBytes(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for(let i=0; i<bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;

// Bikin blok GS v 0 (raster bit image) buat logo -- cuma header+data, TANPA
// ESC_POS_INIT/CUT (itu sudah dibungkus di fungsi pemanggil).
function buildLogoRasterBlock(){
  const raster = base64ToBytes(LOGO_RASTER_B64);
  const bpr = LOGO_RASTER_BYTES_PER_ROW, h = LOGO_RASTER_HEIGHT;
  const header = [0x1D, 0x76, 0x30, 0x00, bpr & 0xFF, (bpr>>8) & 0xFF, h & 0xFF, (h>>8) & 0xFF];
  return concatBytes([header, raster]);
}
// Struk fisik (Bluetooth/USB) full plain text ESC/POS + logo raster di atas --
// nama toko & isi struk semuanya teks biasa (font printer sendiri, tajam &
// konsisten di printer manapun); cuma logo yang tetap gambar (raster kecil,
// siluet bersih jadi aman) karena teks polos gak bisa nampilin gambar.
// Ini yang dipakai printViaBluetooth() & printViaUSB().
function buildEscPosReceiptBytes(sale){
  const encoder = new TextEncoder();
  const lines = receiptText(sale).split('\n');
  const headerLine = lines[0]; // "KOPRAL KERODONG"
  const bodyText = lines.slice(1).join('\n') + '\n\n\n';
  return concatBytes([
    ESC_POS_INIT,
    ESC_ALIGN_CENTER,
    buildLogoRasterBlock(),
    encoder.encode('\n'),
    ESC_BOLD_ON,
    encoder.encode(headerLine + '\n'),
    ESC_BOLD_OFF, ESC_ALIGN_LEFT,
    encoder.encode(bodyText),
    ESC_POS_CUT,
  ]);
}
// Ubah canvas struk (yang sama persis dipakai buat gambar PNG, termasuk logo)
// jadi raster hitam-putih 1-bit, supaya printer thermal mencetak APA ADANYA
// seperti gambarnya -- bukan teks polos berfont kecil bawaan printer.
function canvasToMonoRaster(canvas, targetWidthDots){
  const w = Math.max(8, Math.floor((targetWidthDots||384) / 8) * 8); // wajib kelipatan 8
  const scale = w / canvas.width;
  const h = Math.max(1, Math.round(canvas.height * scale));
  const sc = document.createElement('canvas');
  sc.width = w; sc.height = h;
  const sctx = sc.getContext('2d');
  sctx.fillStyle = '#fff'; sctx.fillRect(0, 0, w, h);
  sctx.drawImage(canvas, 0, 0, w, h);
  const px = sctx.getImageData(0, 0, w, h).data;
  const bytesPerRow = w / 8;
  const raster = new Uint8Array(bytesPerRow * h);
  for(let y=0; y<h; y++){
    for(let bx=0; bx<bytesPerRow; bx++){
      let byte = 0;
      for(let bit=0; bit<8; bit++){
        const x = bx*8 + bit;
        const i = (y*w + x) * 4;
        // Threshold berdasarkan JARAK DARI PUTIH (bukan cuma kecerahan/luminance).
        // Warna cerah tapi pekat seperti emas/oranye punya luminance tinggi
        // (dianggap "terang" oleh rumus luminance biasa) padahal jelas bukan
        // putih -- kalau dites pakai luminance doang, warna itu bisa salah
        // dianggap "putih" dan hilang. Cara ini aman untuk warna apa pun.
        const dist = (255 - px[i]) + (255 - px[i+1]) + (255 - px[i+2]);
        const isDark = px[i+3] > 10 && dist > 220;
        if(isDark) byte |= (1 << (7-bit));
      }
      raster[y*bytesPerRow + bx] = byte;
    }
  }
  return { width: w, height: h, bytesPerRow, raster };
}
// GS v 0 -- perintah ESC/POS standar buat cetak raster bit image, didukung
// hampir semua printer thermal (beda dengan font, yang beda-beda tiap merk).
function buildEscPosImageBytes(mono){
  const { bytesPerRow, height, raster } = mono;
  const header = [0x1D, 0x76, 0x30, 0x00, bytesPerRow & 0xFF, (bytesPerRow>>8) & 0xFF, height & 0xFF, (height>>8) & 0xFF];
  const feed = [0x1B, 0x64, 0x03]; // ESC d 3 -> feed 3 baris sebelum potong
  const out = new Uint8Array(ESC_POS_INIT.length + header.length + raster.length + feed.length + ESC_POS_CUT.length);
  let o = 0;
  out.set(ESC_POS_INIT, o); o += ESC_POS_INIT.length;
  out.set(header, o); o += header.length;
  out.set(raster, o); o += raster.length;
  out.set(feed, o); o += feed.length;
  out.set(ESC_POS_CUT, o); o += ESC_POS_CUT.length;
  return out;
}
// Kirim per potongan kecil dengan jeda -- banyak printer BLE murah punya
// buffer kecil dan bisa kehilangan/mengacak byte (hasil cetak putus-putus)
// kalau dikirim terlalu cepat tanpa jeda.
async function writeInChunks(characteristic, data, chunkSize, delayMs){
  for(let i=0; i<data.length; i+=chunkSize){
    await characteristic.writeValue(data.slice(i, i+chunkSize));
    await new Promise(r=>setTimeout(r, delayMs));
  }
}
// UUID umum dipakai banyak printer thermal Bluetooth murah (mode "serial").
// Tidak dijamin cocok untuk semua merk printer.
const BT_PRINTER_SERVICE = '000018f0-0000-1000-8000-00805f9b34fb';
const BT_PRINTER_CHAR    = '00002af1-0000-1000-8000-00805f9b34fb';

async function printViaBluetooth(){
  if(!state.lastSale){ showAlert('Belum ada transaksi untuk dicetak.'); return; }
  if(!navigator.bluetooth){
    showInfoPopup('Browser/perangkat ini tidak mendukung Web Bluetooth. Coba pakai Chrome terbaru di Android.', 'Tidak Didukung');
    return;
  }
  try{
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [BT_PRINTER_SERVICE] }],
      optionalServices: [BT_PRINTER_SERVICE],
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(BT_PRINTER_SERVICE);
    const characteristic = await service.getCharacteristic(BT_PRINTER_CHAR);
    showAlert('Menyiapkan struk...');
    const data = buildEscPosReceiptBytes(state.lastSale);
    // Potongan kecil + jeda supaya buffer printer BLE murah tidak kebanjiran
    // (penyebab paling umum hasil cetak putus-putus/acak).
    await writeInChunks(characteristic, data, 100, 15);
    showAlert('Struk terkirim ke printer Bluetooth.');
  } catch(err){
    showInfoPopup('Gagal mencetak lewat Bluetooth: ' + (err && err.message ? err.message : err) + '. Pastikan printer menyala, dalam jangkauan, dan sudah di-pairing di pengaturan Bluetooth HP. Kalau tetap gagal/putus-putus, coba tombol "Cetak lewat Sistem" + aplikasi RawBT.', 'Cetak Gagal');
  }
}

async function printViaUSB(){
  if(!state.lastSale){ showAlert('Belum ada transaksi untuk dicetak.'); return; }
  if(!navigator.usb){
    showInfoPopup('Browser/perangkat ini tidak mendukung WebUSB. Coba pakai Chrome terbaru di Android dengan kabel OTG.', 'Tidak Didukung');
    return;
  }
  let device;
  try{
    device = await navigator.usb.requestDevice({ filters: [] });
    await device.open();
    if(device.configuration === null) await device.selectConfiguration(1);
    let ifaceNumber = null, epOut = null;
    for(const iface of device.configuration.interfaces){
      const alt = iface.alternates[0];
      const out = alt.endpoints.find(e=>e.direction==='out');
      if(out){ ifaceNumber = iface.interfaceNumber; epOut = out.endpointNumber; break; }
    }
    if(ifaceNumber===null){ throw new Error('Tidak menemukan jalur output pada perangkat ini.'); }
    await device.claimInterface(ifaceNumber);
    showAlert('Menyiapkan struk...');
    const data = buildEscPosReceiptBytes(state.lastSale);
    await device.transferOut(epOut, data);
    await device.close();
    showAlert('Struk terkirim ke printer USB.');
  } catch(err){
    try{ if(device) await device.close(); }catch(e2){}
    showInfoPopup('Gagal mencetak lewat USB: ' + (err && err.message ? err.message : err) + '. Pastikan printer terhubung lewat kabel OTG dan izin USB diberikan.', 'Cetak Gagal');
  }
}

async function printViaSystem(){
  if(!state.lastSale){ showAlert('Belum ada transaksi untuk dicetak.'); return; }
  const w = window.open('', '_blank', 'width=380,height=600');

/* ============ RIWAYAT ============ */
function isCancelledSale(s){ return s.channel === 'online' && s.orderStatus === 'Dibatalkan'; }
function viewRiwayat(){
  const kasirList = ['Semua', ...new Set([...sales.map(s=>s.kasir), ...expenses.map(e=>e.kasir)])];
  let filteredSales = sales.filter(s => localDateStr(new Date(s.datetime)) === state.historyDate);
  let filteredExpenses = expenses.filter(e => localDateStr(new Date(e.datetime)) === state.historyDate);
  if(state.historyKasir !== 'Semua'){
    filteredSales = filteredSales.filter(s=>s.kasir===state.historyKasir);
    filteredExpenses = filteredExpenses.filter(e=>e.kasir===state.historyKasir);
  }
  // Pesanan online yang dibatalkan tetap ditampilkan di daftar (buat jejak
  // riwayat), tapi TIDAK dihitung sebagai uang masuk -- karena stoknya juga
  // sudah dikembalikan, jadi kalau tetap kehitung, uangnya "ada" padahal
  // barang & pembayarannya sebenarnya tidak jadi.
  const countedSales = filteredSales.filter(s => !isCancelledSale(s));
  const totalPenjualan = countedSales.reduce((s,x)=>s+x.total,0);
  const totalCash = countedSales.filter(s=>(s.paymentMethod||'cash')==='cash').reduce((s,x)=>s+x.total,0);
  const totalQris = countedSales.filter(s=>s.paymentMethod==='qris').reduce((s,x)=>s+x.total,0);
  const totalTransfer = countedSales.filter(s=>s.paymentMethod==='transfer').reduce((s,x)=>s+x.total,0);
  const totalOnline = countedSales.filter(s=>s.channel==='online').reduce((s,x)=>s+x.total,0);
  const totalPengeluaran = filteredExpenses.reduce((s,x)=>s+x.amount,0);
  const totalBersih = totalPenjualan - totalPengeluaran;
  // Saldo tunai FISIK yang seharusnya ada di laci: uang tunai dari penjualan
  // dikurangi pengeluaran -- BUKAN dikurangi dari total semua metode bayar,
  // karena uang QRIS/Transfer/COD tidak pernah masuk laci fisik sama sekali,
  // jadi tidak relevan buat hitung stok uang tunai yang harus ada di laci.
  const saldoTunaiLaci = totalCash - totalPengeluaran;

  const entries = [
    ...filteredSales.map(s=>({type:'sale', time:s.datetime, data:s})),
    ...filteredExpenses.map(e=>({type:'expense', time:e.datetime, data:e})),
  ].sort((a,b)=> new Date(b.time) - new Date(a.time));

  const pending = pendingOnlineOrders().sort((a,b)=> new Date(a.datetime) - new Date(b.datetime));

  return `
    ${pending.length>0 ? `
    <div class="card" style="margin-bottom:16px; border-color:var(--gold); background:rgba(245,166,35,0.08);">
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
        <span style="font-size:18px;">⏳</span>
        <strong style="font-size:14.5px;">${pending.length} Pesanan Online Menunggu Konfirmasi</strong>
      </div>
      ${pending.map(s => `
        <div style="background:var(--paper); border-radius:12px; padding:10px 12px; margin-bottom:8px; border:1px solid var(--line);">
          <div style="display:flex; justify-content:space-between; gap:8px;">
            <div>
              <div style="font-weight:700; font-size:13.5px;">${escapeHtml(s.customerName||s.kasir)} · ${rp(s.total)}</div>
              <div class="muted" style="font-size:11.5px; margin-top:1px;">#${s.id} · ${timeAgo(s.datetime)} · ${s.items.length} produk</div>
            </div>
          </div>
          <div class="row" style="margin-top:8px; gap:8px;">
            ${s.customerPhone ? `<a class="btn btn-primary" style="padding:8px 10px; font-size:12px;" target="_blank" href="https://api.whatsapp.com/send/?phone=62${escapeAttr(String(s.customerPhone).replace(/^0/,''))}&text&type=phone_number&app_absent=0">Chat WA</a>` : ''}
            <button class="btn btn-dark" style="padding:8px 10px; font-size:12px;" onclick="confirmOnlineOrderPaid(${s.id})">Sudah Bayar</button>
            <button class="btn btn-danger" style="padding:8px 10px; font-size:12px;" onclick="cancelOnlineOrder(${s.id})">Batalkan</button>
          </div>
        </div>
      `).join('')}
    </div>
    ` : ''}
    <div class="row" style="margin-bottom:12px;">
      <div class="field" style="margin-bottom:0;">
        <label>Tanggal</label>
        <input type="date" value="${state.historyDate}" onchange="state.historyDate=this.value; render();">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>Kasir</label>
        <select onchange="state.historyKasir=this.value; render();">
          ${kasirList.map(k=>`<option value="${k}" ${state.historyKasir===k?'selected':''}>${k}</option>`).join('')}
        </select>
      </div>
    </div>
    <button class="btn btn-outline" style="margin-bottom:10px;" onclick="openModal('newExpense')">${ICONS.plus} Catat Pengeluaran</button>
    <div class="row" style="margin-bottom:14px;">
      <button class="btn btn-dark" onclick="downloadDailyReport()">${ICONS.download} Laporan Harian</button>
      <button class="btn btn-dark" onclick="downloadMonthlyReport()">${ICONS.download} Laporan Bulanan</button>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="summary-row"><span>Total Penjualan</span><span>${rp(totalPenjualan)}</span></div>
      <div class="summary-row" style="padding-left:12px; font-size:12.5px; color:var(--ink-soft);"><span>· Tunai (fisik di laci)</span><span>${rp(totalCash)}</span></div>
      <div class="summary-row" style="padding-left:12px; font-size:12.5px; color:var(--ink-soft);"><span>· QRIS</span><span>${rp(totalQris)}</span></div>
      <div class="summary-row" style="padding-left:12px; font-size:12.5px; color:var(--ink-soft);"><span>· Transfer</span><span>${rp(totalTransfer)}</span></div>
      <div class="summary-row"><span>Total Pengeluaran</span><span>- ${rp(totalPengeluaran)}</span></div>
      <div class="summary-row total"><span>Total Bersih (semua metode)</span><span>${rp(totalBersih)}</span></div>
      <div class="tag" style="margin-top:10px; display:inline-block;">${filteredSales.length} transaksi · ${filteredExpenses.length} pengeluaran</div>
      ${totalOnline>0 ? `<div class="tag" style="margin-top:6px; margin-left:6px; display:inline-block; background:rgba(37,211,102,0.14); color:var(--whatsapp-deep);">🌐 ${rp(totalOnline)} dari Website</div>` : ''}
    </div>

    <div class="card" style="margin-bottom:16px; border-color:var(--forest); background:rgba(31,68,54,0.06);">
      <div style="font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:8px;">💵 SALDO TUNAI DI LACI (buat cocokkan ke uang fisik)</div>
      <div class="summary-row" style="font-size:12.5px; color:var(--ink-soft);"><span>Tunai dari penjualan</span><span>${rp(totalCash)}</span></div>
      <div class="summary-row" style="font-size:12.5px; color:var(--ink-soft);"><span>- Pengeluaran</span><span>- ${rp(totalPengeluaran)}</span></div>
      <div class="summary-row total" style="font-size:19px;"><span>Seharusnya di Laci</span><span>${rp(saldoTunaiLaci)}</span></div>
      <div class="muted" style="font-size:11px; margin-top:6px;">QRIS/Transfer/COD tidak dihitung di sini karena uangnya tidak pernah masuk laci fisik.</div>
    </div>

    ${entries.length===0 ? `<div class="empty">Belum ada transaksi atau pengeluaran di tanggal ini.</div>` :
      entries.map(en => en.type==='sale' ? saleCardHtml(en.data) : expenseCardHtml(en.data)).join('')
    }
  `;
}
function orderStatusBadge(s){
  if(s.channel !== 'online') return '';
  const status = s.orderStatus || 'Menunggu Konfirmasi';
  const map = {
    'Menunggu Konfirmasi': {bg:'rgba(245,166,35,0.18)', color:'var(--gold-deep)', label:'⏳ Menunggu Konfirmasi'},

function expenseCardHtml(e){
  return `
    <div class="card sale-card">

      <button class="btn btn-danger" style="margin-top:10px; width:auto; padding:8px 14px; font-size:13px;" onclick="deleteExpense(${e.id})">${ICONS.trash} Hapus Pengeluaran</button>
    </div>`;

function toggleSale(id){ state.historyExpanded[id] = !state.historyExpanded[id]; render(); }

function confirmOnlineOrderPaid(id){
  const s = sales.find(x=>x.id===id);
  if(!s) return;
  s.orderStatus = 'Dibayar';
  persistSales();
  showAlert('Pesanan #' + id + ' ditandai sudah dibayar.');
  render();
}
function cancelOnlineOrder(id){
  const s = sales.find(x=>x.id===id);
  if(!s) return;
  askConfirm('Batalkan pesanan #' + id + ' (' + rp(s.total) + ') dan kembalikan stoknya? Aksi ini tidak bisa diurungkan.', async function(){
    for(const it of s.items){
      const p = products.find(x=>x.id===it.productId);
      if(!p) continue; // produk sudah dihapus dari katalog, stoknya tidak bisa dikembalikan otomatis
      let newStock = null;
      if(SYNC_ENABLED) newStock = await syncDecrementStock(it.productId, -it.qty); // qty negatif = tambah balik
      if(newStock === null) newStock = p.stock + it.qty; // fallback kalau offline/gagal sync
      p.stock = newStock;
    }
    saveJSON('kk_products', products);
    s.orderStatus = 'Dibatalkan';
    persistSales();
    showAlert('Pesanan #' + id + ' dibatalkan, stok sudah dikembalikan.');
    render();
  });
}

async function confirmResetApp(){
  const phrase = (document.getElementById('reset-phrase').value || '').trim();
  const pin = (document.getElementById('reset-pin').value || '').trim();
  if(phrase !== 'HAPUS SEMUA'){ showAlert('Ketik persis "HAPUS SEMUA" (huruf besar semua) untuk konfirmasi.'); return; }
  if(!/^\d{4}$/.test(pin)){ showAlert('PIN harus 4 digit angka.'); return; }
  if(!sb){ showAlert('Koneksi internet terputus, reset dibatalkan supaya data cloud tidak ikut tertinggal.'); return; }
  try{
    const { error } = await sb.rpc('kk_reset_all_data', { p_staff_id: session.id, p_pin: pin });
    if(error) throw error;
  }catch(err){
    showInfoPopup('Reset dibatalkan: ' + (err && err.message ? err.message : err), 'Gagal Reset');
    return;
  }
  // Sukses di cloud -- sekarang bersihin semua data lokal (bukan cuma beberapa
  // key yang keinget, tapi SEMUA key berawalan "kk_" biar bener2 kayak baru
  // diinstal, termasuk sisa-sisa dari versi lama kalau ada).
  Object.keys(localStorage).filter(k=>k.startsWith('kk_')).forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  products = []; sales = []; expenses = []; categoryOrder = [];
  users = DEFAULT_USERS.map(u=>({id:u.id, name:u.name}));
  session = null;
  closeModal();
  state.screen = 'login';
  showAlert('Aplikasi sudah direset total. Login pakai Admin / PIN 0000.');
  render();
}

  if(m.type==='manualItem') inner = modalManualItem();

function moveCategory(name, dir){
  const idx = categoryOrder.indexOf(name);
  if(idx===-1) return;
  const newIdx = idx + dir;
  if(newIdx<0 || newIdx>=categoryOrder.length) return;
  const tmp = categoryOrder[idx];
  categoryOrder[idx] = categoryOrder[newIdx];
  categoryOrder[newIdx] = tmp;
  persistCategoryOrder();
  render();
}
function moveCategoryUp(enc){ moveCategory(decodeURIComponent(enc), -1); }
function moveCategoryDown(enc){ moveCategory(decodeURIComponent(enc), 1); }
function startEditCategory(enc){ state.modal.data.editing = decodeURIComponent(enc); render(); }
function cancelEditCategory(){ state.modal.data.editing = null; render(); }
function saveCategoryRename(enc){
  const oldName = decodeURIComponent(enc);
  const newName = document.getElementById('cat-edit-input').value.trim();
  if(!newName){ showAlert('Nama kategori tidak boleh kosong'); return; }
  products.forEach(p=>{ if(p.category===oldName) p.category=newName; });
  persistProducts();
  const idx = categoryOrder.indexOf(oldName);
  if(idx!==-1) categoryOrder[idx] = newName; else categoryOrder.push(newName);
  persistCategoryOrder();
  state.modal.data.editing = null;
  render();
}
function removeCategory(enc, count){
  const name = decodeURIComponent(enc);
  askConfirm(`Kategori "${name}" dipakai ${count} produk. Semua produk itu akan dipindah ke kategori "Lainnya". Lanjutkan?`, function(){
    products.forEach(p=>{ if(p.category===name) p.category='Lainnya'; });
    persistProducts();
  });
}

async function generateExcelReport(salesList, expensesList, title, filename){
  try{
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  } catch(err){
    showInfoPopup('Gagal memuat pustaka pembuat file Excel. Perlu koneksi internet minimal sekali untuk fitur ini. ' + (err && err.message ? err.message : ''), 'Gagal Membuat Laporan');
    return;
  }
  if(!salesList.length && !expensesList.length){
    showAlert('Tidak ada data penjualan/pengeluaran pada periode ini.');
    return;
  }

  const countedSales = salesList.filter(s => !isCancelledSale(s));
  const totalPenjualan = countedSales.reduce((s,x)=>s+x.total,0);
  const totalTunai = countedSales.filter(s=>(s.paymentMethod||'cash')==='cash').reduce((s,x)=>s+x.total,0);
  const totalQris = countedSales.filter(s=>s.paymentMethod==='qris').reduce((s,x)=>s+x.total,0);
  const totalTransfer = countedSales.filter(s=>s.paymentMethod==='transfer').reduce((s,x)=>s+x.total,0);
  const totalOnline = countedSales.filter(s=>s.channel==='online').reduce((s,x)=>s+x.total,0);
  const totalPengeluaran = expensesList.reduce((s,x)=>s+x.amount,0);
  const totalBersih = totalPenjualan - totalPengeluaran;
  const saldoTunaiLaci = totalTunai - totalPengeluaran;
  const cancelledCount = salesList.length - countedSales.length;

  const ringkasanRows = [
    ['Kopral Kerodong'],
    [title],
    ['Dibuat', fmtDate(new Date().toISOString())],
    [],
    ['Total Penjualan', totalPenjualan],
    ['  - Tunai (fisik di laci)', totalTunai],
    ['  - QRIS', totalQris],
    ['  - Transfer', totalTransfer],
    ['  - dari Website (Online)', totalOnline],
    ['Total Pengeluaran', totalPengeluaran],
    ['Total Bersih (semua metode)', totalBersih],
    [],
    ['Saldo Tunai di Laci (Tunai - Pengeluaran)', saldoTunaiLaci],
    [],
    ['Jumlah Transaksi (dihitung)', countedSales.length],
    ['Jumlah Pesanan Dibatalkan (tidak dihitung)', cancelledCount],
    ['Jumlah Pengeluaran', expensesList.length],
  ];

  const transaksiHeader = ['No','Tanggal','Jam','Kasir','Sumber','Status','Jumlah Item','Metode Bayar','Subtotal','Diskon','Total','Tunai/Dibayar','Kembalian'];
  const transaksiRows = salesList.map((s,i)=>[
    i+1,
    new Date(s.datetime).toLocaleDateString('id-ID'),
    new Date(s.datetime).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),
    s.kasir,
    s.channel==='online' ? 'Online' : 'Toko',
    isCancelledSale(s) ? 'Dibatalkan (tidak dihitung)' : (s.orderStatus || 'Selesai'),
    s.items.reduce((a,it)=>a+it.qty,0),
    payMethodLabel(s.paymentMethod),
    s.subtotal, s.discount, s.total, s.cash, s.change,
  ]);

  const itemHeader = ['No','Tanggal','Jam','Kasir','Produk','Qty','Harga Satuan','Subtotal'];
  let itemNo = 1;
  const itemRows = [];
  countedSales.forEach(s=>{
    s.items.forEach(it=>{
      itemRows.push([
        itemNo++,
        new Date(s.datetime).toLocaleDateString('id-ID'),
        new Date(s.datetime).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),
        s.kasir, it.name, it.qty, it.price, it.subtotal,
      ]);
    });
  });

  const pengeluaranHeader = ['No','Tanggal','Jam','Kasir','Keterangan','Nominal'];
  const pengeluaranRows = expensesList.map((e,i)=>[
    i+1,
    new Date(e.datetime).toLocaleDateString('id-ID'),
    new Date(e.datetime).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),
    e.kasir, e.description, e.amount,
  ]);

  try{
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ringkasanRows), 'Ringkasan');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([transaksiHeader, ...transaksiRows]), 'Transaksi');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([itemHeader, ...itemRows]), 'Detail Item');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([pengeluaranHeader, ...pengeluaranRows]), 'Pengeluaran');
    XLSX.writeFile(wb, filename);
    showAlert('Laporan berhasil diunduh: ' + filename);
  } catch(err){
    showInfoPopup('Gagal membuat file laporan: ' + (err && err.message ? err.message : err), 'Gagal Membuat Laporan');
  }
}

/* ============ DOWNLOAD STOK PRODUK (EXCEL) ============ */
async function downloadStockExcel(){
  try{
    await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
  } catch(err){
    showInfoPopup('Gagal memuat pustaka pembuat file Excel. Perlu koneksi internet minimal sekali untuk fitur ini. ' + (err && err.message ? err.message : ''), 'Gagal Membuat File');
    return;
  }
  if(!products.length){ showAlert('Belum ada produk di katalog.'); return; }

  const statusOf = (p) => p.stock<=0 ? 'Habis' : (p.stock<=2 ? 'Menipis' : 'Aman');
  const FILL_HABIS = 'FFFFC7CE', FONT_HABIS = 'FF9C0006';
  const FILL_MENIPIS = 'FFFFEB9C', FONT_MENIPIS = 'FF9C6500';

  try{
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Kopral Kerodong';
    wb.created = new Date();

    const sR = wb.addWorksheet('Ringkasan');
    sR.addRow(['Kopral Kerodong']).font = {bold:true, size:14};
    sR.addRow(['Laporan Stok Produk']);
    sR.addRow(['Dibuat', fmtDate(new Date().toISOString())]);
    sR.addRow([]);
    sR.addRow(['Jumlah Produk', products.length]);
    sR.addRow(['Total Unit Stok', products.reduce((s,p)=>s+p.stock,0)]);
    sR.addRow(['Produk Stok Habis', products.filter(p=>p.stock<=0).length]);
    sR.addRow(['Produk Stok Menipis (<=2)', products.filter(p=>p.stock>0 && p.stock<=2).length]);
    sR.columns = [{width:28},{width:20}];

    const sS = wb.addWorksheet('Stok Produk');
    const header = sS.addRow(['No','Nama Produk','Kategori','Harga Ecer','Harga Grosir','Stok','Status']);
    header.eachCell(cell=>{
      cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF1F4436'}};
      cell.font = {bold:true, color:{argb:'FFFFFFFF'}};
    });
    products.forEach((p,i)=>{
      const status = statusOf(p);
      const row = sS.addRow([i+1, p.name, p.category, p.priceEcer, p.priceGrosir, p.stock, status]);
      if(status === 'Habis'){
        row.eachCell(cell=>{ cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:FILL_HABIS}}; cell.font = {color:{argb:FONT_HABIS}}; });
      } else if(status === 'Menipis'){
        row.eachCell(cell=>{ cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:FILL_MENIPIS}}; cell.font = {color:{argb:FONT_MENIPIS}}; });
      }
    });
    sS.columns = [{width:5},{width:32},{width:16},{width:14},{width:14},{width:9},{width:10}];

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'stok-produk-kopralkerodong-' + todayStr() + '.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showAlert('File stok produk berhasil diunduh.');
  } catch(err){
    showInfoPopup('Gagal membuat file stok: ' + (err && err.message ? err.message : err), 'Gagal Membuat File');
  }
}

function compressImageFile(file, maxWidth, quality){
  maxWidth = maxWidth || 720; quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Gagal membaca file foto.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('File yang dipilih bukan gambar yang valid.'));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => {
          if(!blob){ reject(new Error('Gagal mengompres foto.')); return; }
          resolve({ blob, dataUrl: canvas.toDataURL('image/jpeg', quality) });
        }, 'image/jpeg', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function onProductPhotoChosen(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!/^image\//.test(file.type)){ showAlert('File harus berupa gambar (JPG/PNG/WebP).'); return; }
  try{
    const { blob, dataUrl } = await compressImageFile(file);
    pendingPhotoBlob = blob;
    pendingPhotoPreview = dataUrl;

}
function removeProductPhoto(productId){

  renderPhotoPreviewOnly(productId!=null ? products.find(x=>x.id===productId) : null);
}
async function uploadProductPhoto(productId, blob){
  if(!SYNC_ENABLED || !sb) throw new Error('Belum tersambung ke server, tidak bisa upload foto.');
  const path = 'product-' + productId + '-' + Date.now() + '.jpg';
  const { error } = await sb.storage.from('kk_product_photos').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
  if(error) throw error;
  const { data } = sb.storage.from('kk_product_photos').getPublicUrl(path);
  return data.publicUrl;
}
async function saveProduct(id){
  const name = document.getElementById('pf-name').value.trim();
  const category = document.getElementById('pf-cat').value.trim() || 'Lainnya';
  const priceEcer = Number(document.getElementById('pf-price-ecer').value.replace(/[^0-9]/g,''))||0;
  const priceGrosir = Number(document.getElementById('pf-price-grosir').value.replace(/[^0-9]/g,''))||0;
  const stock = Number(document.getElementById('pf-stock').value)||0;
  if(!name){ showAlert('Nama produk wajib diisi'); return; }

  const targetId = id===null ? nextId(products) : id;
  let imageUrl = id===null ? null : ((products.find(x=>x.id===id)||{}).imageUrl || null);
  if(pendingPhotoRemoved) imageUrl = null;

  if(pendingPhotoBlob){
    const saveBtn = document.getElementById('pf-save-btn');
    if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Mengunggah foto...'; }
    try{
      imageUrl = await uploadProductPhoto(targetId, pendingPhotoBlob);
    }catch(e){
      showInfoPopup('Gagal mengunggah foto: ' + (e && e.message ? e.message : e) + '\n\nProduk tetap disimpan tanpa foto baru. Anda bisa coba upload lagi lewat Edit Produk.', 'Gagal Unggah Foto');
    }
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Simpan'; }
  }

  if(id===null){
    products.push({id: targetId, name, category, priceEcer, priceGrosir, stock, imageUrl});
  } else {
    const p = products.find(x=>x.id===id);
    p.name=name; p.category=category; p.priceEcer=priceEcer; p.priceGrosir=priceGrosir; p.stock=stock; p.imageUrl=imageUrl;
  }
  persistProducts();
  resetPendingPhoto();
  closeModal();
}

function exportBackup(){
  const payload = {
    app: 'kasir-kopral-kerodong',
    version: 1,
    exportedAt: new Date().toISOString(),
    data: { products, users, sales, categoryOrder, expenses },
  };
  const text = JSON.stringify(payload, null, 2);
  const blob = new Blob([text], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  a.href = url; a.download = 'backup-kasir-kopralkerodong-' + stamp + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showAlert('Backup berhasil diunduh.');
}

function mergeProductsUpdate(incoming){
  (incoming||[]).forEach(item=>{
    const existing = products.find(p=>p.name.trim().toLowerCase() === String(item.name||'').trim().toLowerCase());
    if(existing){
      if(item.category) existing.category = item.category;
      if(item.priceEcer!=null) existing.priceEcer = item.priceEcer;
      if(item.priceGrosir!=null) existing.priceGrosir = item.priceGrosir;
      if(item.stock!=null) existing.stock = item.stock;
    } else {
      products.push({ id: nextId(products), name:item.name, category:item.category||'Lainnya', priceEcer:item.priceEcer||0, priceGrosir:item.priceGrosir||0, stock:item.stock||0 });
    }
  });
}
// Restore/merge staff dari file backup lokal HARUS lewat RPC sekarang (baris
// 'users' di kk_store sudah diblok RLS langsung) -- makanya async & butuh sb.
async function syncRestoreStaffMerge(incoming){
  if(!sb) return;
  for(const item of (incoming||[])){
    const existing = users.find(u=>u.name.trim().toLowerCase() === String(item.name||'').trim().toLowerCase());
    try{
      if(existing){
        const pin = /^\d{4}$/.test(item.pin||'') ? item.pin : null;
        await sb.rpc('kk_update_staff', { p_id: existing.id, p_name: existing.name, p_pin: pin });
      } else {
        await sb.rpc('kk_add_staff', { p_name: item.name, p_pin: /^\d{4}$/.test(item.pin||'') ? item.pin : '0000' });
      }
    }catch(e){ console.warn('Gagal restore kasir:', item.name, e); }
  }
  await refreshStaffNames();
}
async function syncRestoreStaffOverwrite(incoming){
  if(!sb) return;
  const list = (incoming && incoming.length) ? incoming : DEFAULT_USERS.slice();
  const oldIds = users.map(u=>u.id);
  for(const item of list){
    try{ await sb.rpc('kk_add_staff', { p_name: item.name, p_pin: /^\d{4}$/.test(item.pin||'') ? item.pin : '0000' }); }
    catch(e){ console.warn('Gagal restore kasir (tambah):', item.name, e); }
  }
  for(const id of oldIds){
    try{ await sb.rpc('kk_delete_staff', { p_id: id }); }
    catch(e){ console.warn('Gagal restore kasir (hapus lama):', id, e); }
  }
  await refreshStaffNames();
}
function mergeSalesUpdate(incoming){
  const sig = (s) => s.datetime + '|' + s.kasir + '|' + s.total + '|' + (s.paymentMethod||'cash');
  const existingSigs = new Set(sales.map(sig));
  let idCounter = nextId(sales);
  (incoming||[]).forEach(item=>{
    const s = sig(item);
    if(!existingSigs.has(s)){
      sales.push(Object.assign({}, item, {id: idCounter++}));
      existingSigs.add(s);
    }
  });
}
function mergeExpensesUpdate(incoming){
  const sig = (e) => e.datetime + '|' + e.kasir + '|' + e.description + '|' + e.amount;
  const existingSigs = new Set(expenses.map(sig));
  let idCounter = nextId(expenses);
  (incoming||[]).forEach(item=>{
    const s = sig(item);
    if(!existingSigs.has(s)){
      expenses.push(Object.assign({}, item, {id: idCounter++}));
      existingSigs.add(s);
    }
  });
}
function mergeCategoryOrderUpdate(incoming){
  (incoming||[]).forEach(c=>{ if(!categoryOrder.includes(c)) categoryOrder.push(c); });
}
function confirmRestore(){
  const data = state.pendingRestoreData;
  if(!data){ closeModal(); return; }
  const mode = state.restoreMode || 'update';
  askConfirm(
    mode==='overwrite'
      ? 'Mode Timpa akan MENGHAPUS SEMUA data yang ada sekarang dan menggantinya total dengan isi backup. Lanjutkan?'
      : 'Data backup akan digabung dengan data yang ada sekarang. Lanjutkan?',
    async function(){
      if(!sb){ showAlert('Akun kasir gak bisa dipulihkan tanpa koneksi ke server (produk/transaksi/pengeluaran tetap diproses). Coba lagi kalau internet sudah nyambung.'); }
      const oldProductIds = products.map(p=>p.id);
      const oldSaleIds = sales.map(s=>s.id);
      const oldExpenseIds = expenses.map(e=>e.id);
      if(mode === 'overwrite'){
        products = data.products || [];
        sales = data.sales || [];
        categoryOrder = data.categoryOrder || [];
        expenses = data.expenses || [];
        await syncRestoreStaffOverwrite(data.users);
      } else {
        mergeProductsUpdate(data.products);
        await syncRestoreStaffMerge(data.users);
        mergeSalesUpdate(data.sales);
        mergeExpensesUpdate(data.expenses);
        mergeCategoryOrderUpdate(data.categoryOrder);
      }
      persistProducts(); persistSales(); persistCategoryOrder(); persistExpenses();
      // Mode Timpa: hapus juga baris di cloud yang tidak ada di backup, supaya
      // "Timpa" benar2 timpa total di cloud (upsert saja tidak menghapus).
      if(mode === 'overwrite' && SYNC_ENABLED){
        const newProductIds = products.map(p=>p.id), newSaleIds = sales.map(s=>s.id), newExpenseIds = expenses.map(e=>e.id);
        oldProductIds.filter(id => !newProductIds.includes(id)).forEach(id => syncDeleteRow(PRODUCTS_TABLE, id));
        oldSaleIds.filter(id => !newSaleIds.includes(id)).forEach(id => syncDeleteRow(SALES_TABLE, id));
        oldExpenseIds.filter(id => !newExpenseIds.includes(id)).forEach(id => syncDeleteRow(EXPENSES_TABLE, id));
      }
      if(session && !users.find(u=>u.id===session.id)){
        session = null; persistSession();
        state.screen = 'login';
      }
      state.pendingRestoreData = null;
      showAlert(mode==='overwrite' ? 'Data berhasil ditimpa total.' : 'Data backup berhasil digabung.');
    }
  );
}

function applyImportedRows(rows2d){
  rows2d = (rows2d||[]).filter(r => Array.isArray(r) && r.some(c => String(c==null?'':c).trim() !== ''));
  if(rows2d.length < 2){
    state.modal.data.loading = false;
    state.modal.data.error = 'Tidak ada data terbaca. Pastikan baris pertama berisi judul kolom (Nama, Kategori, Harga, Stok).';
    render();
    return;
  }
  const headers = rows2d[0].map(h => String(h==null?'':h).trim());
  const rows = rows2d.slice(1);
  const mapping = {
    name: guessColumn(headers, /nama|produk|product|item|^name$/i),
    category: guessColumn(headers, /kategori|category/i),
    priceEcer: guessColumn(headers, /harga\s*ecer|ecer|^harga$|^price$/i),
    priceGrosir: guessColumn(headers, /harga\s*grosir|grosir|wholesale/i),
    stock: guessColumn(headers, /stok|stock|qty|jumlah/i),
  };
  state.modal.data.step = 'mapping';
  state.modal.data.loading = false;
  state.modal.data.error = null;
  state.modal.data.headers = headers;
  state.modal.data.rows = rows;
  state.modal.data.mapping = mapping;

async function handleImportFileChange(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  state.modal.data.loading = true; state.modal.data.error = null; render();
  try{
    const ext = (file.name.split('.').pop()||'').toLowerCase();
    let rows2d;
    if(ext === 'csv'){
      const text = await file.text();
      rows2d = parseCSV(text);
    } else {
      await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      rows2d = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
    }
    applyImportedRows(rows2d);
  } catch(err){
    state.modal.data.loading = false;
    state.modal.data.error = 'Gagal membaca file: ' + (err && err.message ? err.message : err);
    render();
  }
}

function setImportMapping(field, idxStr){

function buildImportedProductList(){
  const d = state.modal.data;
  const list = [];
  if(!d || d.mapping.name === -1) return list;
  d.rows.forEach(r=>{
    const name = String(r[d.mapping.name]==null?'':r[d.mapping.name]).trim();
    if(!name) return;
    const category = d.mapping.category !== -1 ? String(r[d.mapping.category]==null?'':r[d.mapping.category]).trim() : '';
    const priceEcer = d.mapping.priceEcer !== -1 ? parseNumberLoose(r[d.mapping.priceEcer]) : 0;
    let priceGrosir;
    if(d.mapping.priceGrosir !== -1){
      const raw = String(r[d.mapping.priceGrosir]==null?'':r[d.mapping.priceGrosir]).trim();
      priceGrosir = raw ? parseNumberLoose(raw) : priceEcer;
    } else priceGrosir = priceEcer;
    const stock = d.mapping.stock !== -1 ? parseNumberLoose(r[d.mapping.stock]) : 0;
    list.push({ name, category: category || 'Lainnya', priceEcer, priceGrosir, stock });
  });
  return list;
}
function computeImportPlan(){
  const d = state.modal.data;
  const plan = { toAdd: [], toUpdate: [], skipped: 0 };
  if(!d || d.mapping.name === -1) return plan;
  d.rows.forEach(r=>{
    const name = String(r[d.mapping.name]==null?'':r[d.mapping.name]).trim();
    if(!name){ plan.skipped++; return; }
    const category = d.mapping.category !== -1 ? String(r[d.mapping.category]==null?'':r[d.mapping.category]).trim() : '';
    const priceEcer = d.mapping.priceEcer !== -1 ? parseNumberLoose(r[d.mapping.priceEcer]) : null;
    let priceGrosir;
    if(d.mapping.priceGrosir !== -1){
      const rawGrosir = String(r[d.mapping.priceGrosir]==null ? '' : r[d.mapping.priceGrosir]).trim();
      priceGrosir = rawGrosir ? parseNumberLoose(rawGrosir) : priceEcer;
    } else {
      priceGrosir = priceEcer;
    }
    const stock = d.mapping.stock !== -1 ? parseNumberLoose(r[d.mapping.stock]) : null;
    const existing = products.find(p => p.name.trim().toLowerCase() === name.toLowerCase());
    if(existing) plan.toUpdate.push({name, category, priceEcer, priceGrosir, stock});
    else plan.toAdd.push({name, category: category || 'Lainnya', priceEcer: priceEcer || 0, priceGrosir: priceGrosir || 0, stock: stock || 0});
  });
  return plan;
}
function commitImport(){
  const mode = state.modal.data.importMode || 'update';
  if(mode === 'overwrite'){
    const newList = buildImportedProductList();
    askConfirm('Mode Timpa akan MENGHAPUS semua produk yang tidak ada di file ini dan menggantinya total dengan ' + newList.length + ' produk dari file. Lanjutkan?', function(){
      const oldIds = products.map(p => p.id);
      const maxExisting = products.length ? Math.max(...products.map(p=>p.id)) : 0;
      const startId = Math.max(Date.now(), maxExisting + 1);
      products = newList.map((item, i) => ({ id: startId + i, name:item.name, category:item.category, priceEcer:item.priceEcer, priceGrosir:item.priceGrosir, stock:item.stock }));
      persistProducts();
      // hapus produk lama dari cloud juga, supaya "Timpa" benar2 timpa total
      // di cloud, bukan cuma nambah/update (upsert saja tidak menghapus).
      if(SYNC_ENABLED){
        const newIds = products.map(p=>p.id);
        oldIds.filter(id => !newIds.includes(id)).forEach(id => syncDeleteRow(PRODUCTS_TABLE, id));
      }
      showAlert('Katalog produk ditimpa total: ' + products.length + ' produk dari file ini.');
    });
    return;
  }
  const plan = computeImportPlan();
  plan.toAdd.forEach(item=>{
    products.push({id: nextId(products), name:item.name, category:item.category, priceEcer:item.priceEcer, priceGrosir:item.priceGrosir, stock:item.stock});
  });
  plan.toUpdate.forEach(item=>{
    const p = products.find(pp => pp.name.trim().toLowerCase() === item.name.toLowerCase());
    if(p){
      if(item.category) p.category = item.category;
      if(item.priceEcer !== null) p.priceEcer = item.priceEcer;
      if(item.priceGrosir !== null) p.priceGrosir = item.priceGrosir;
      if(item.stock !== null) p.stock = (p.stock || 0) + item.stock; // update = tambah stok (restock), bukan menimpa
    }
  });
  persistProducts();
  const addedCount = plan.toAdd.length, updatedCount = plan.toUpdate.length, skippedCount = plan.skipped;
  closeModal();
  showAlert('Impor selesai: ' + addedCount + ' produk baru, ' + updatedCount + ' diperbarui' + (skippedCount ? ', ' + skippedCount + ' baris dilewati' : '') + '.');
}
