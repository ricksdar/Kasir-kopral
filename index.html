function buildImportedProductList(){
  const d = state.modal.data;
  const list = [];
  if(!d || d.mapping.name === -1) return list;
  d.rows.forEach(r=>{
    const name = String(r[d.mapping.name]==null?'':r[d.mapping.name]).trim();
    if(!name) return;
    const category = d.mapping.category !== -1 ? String(r[d.mapping.category]==null?'':r[d.mapping.category]).trim() : '';
    const priceEcer = d.mapping.priceEcer !== -1 ? parseNumberLoose(r[d.mapping.priceEcer]) : 0;
    let priceGrosir;
    if(d.mapping.priceGrosir !== -1){
      const raw = String(r[d.mapping.priceGrosir]==null?'':r[d.mapping.priceGrosir]).trim();
      priceGrosir = raw ? parseNumberLoose(raw) : priceEcer;
    } else priceGrosir = priceEcer;
    const stock = d.mapping.stock !== -1 ? parseNumberLoose(r[d.mapping.stock]) : 0;
    list.push({ name, category: category || 'Lainnya', priceEcer, priceGrosir, stock });
  });
  return list;
}
function computeImportPlan(){
  const d = state.modal.data;
  const plan = { toAdd: [], toUpdate: [], skipped: 0 };
  if(!d || d.mapping.name === -1) return plan;
  d.rows.forEach(r=>{
    const name = String(r[d.mapping.name]==null?'':r[d.mapping.name]).trim();
    if(!name){ plan.skipped++; return; }
    const category = d.mapping.category !== -1 ? String(r[d.mapping.category]==null?'':r[d.mapping.category]).trim() : '';
    const priceEcer = d.mapping.priceEcer !== -1 ? parseNumberLoose(r[d.mapping.priceEcer]) : null;
    let priceGrosir;
    if(d.mapping.priceGrosir !== -1){
      const rawGrosir = String(r[d.mapping.priceGrosir]==null ? '' : r[d.mapping.priceGrosir]).trim();
      priceGrosir = rawGrosir ? parseNumberLoose(rawGrosir) : priceEcer;
    } else {
      priceGrosir = priceEcer;
    }
    const stock = d.mapping.stock !== -1 ? parseNumberLoose(r[d.mapping.stock]) : null;
    const existing = products.find(p => p.name.trim().toLowerCase() === name.toLowerCase());
    if(existing) plan.toUpdate.push({name, category, priceEcer, priceGrosir, stock});
    else plan.toAdd.push({name, category: category || 'Lainnya', priceEcer: priceEcer || 0, priceGrosir: priceGrosir || 0, stock: stock || 0});
  });
  return plan;
}
function commitImport(){
  const mode = state.modal.data.importMode || 'update';
  if(mode === 'overwrite'){
    const newList = buildImportedProductList();
    askConfirm('Mode Timpa akan MENGHAPUS semua produk yang tidak ada di file ini dan menggantinya total dengan ' + newList.length + ' produk dari file. Lanjutkan?', function(){
      const oldIds = products.map(p => p.id);
      const maxExisting = products.length ? Math.max(...products.map(p=>p.id)) : 0;
      const startId = Math.max(Date.now(), maxExisting + 1);
      products = newList.map((item, i) => ({ id: startId + i, name:item.name, category:item.category, priceEcer:item.priceEcer, priceGrosir:item.priceGrosir, stock:item.stock }));
      persistProducts();
      // hapus produk lama dari cloud juga, supaya "Timpa" benar2 timpa total
      // di cloud, bukan cuma nambah/update (upsert saja tidak menghapus).
      if(SYNC_ENABLED){
        const newIds = products.map(p=>p.id);
        oldIds.filter(id => !newIds.includes(id)).forEach(id => syncDeleteRow(PRODUCTS_TABLE, id));
      }
      showAlert('Katalog produk ditimpa total: ' + products.length + ' produk dari file ini.');
    });
    return;
  }
  const plan = computeImportPlan();
  plan.toAdd.forEach(item=>{
    products.push({id: nextId(products), name:item.name, category:item.category, priceEcer:item.priceEcer, priceGrosir:item.priceGrosir, stock:item.stock});
  });
  plan.toUpdate.forEach(item=>{
    const p = products.find(pp => pp.name.trim().toLowerCase() === item.name.toLowerCase());
    if(p){
      if(item.category) p.category = item.category;
      if(item.priceEcer !== null) p.priceEcer = item.priceEcer;
      if(item.priceGrosir !== null) p.priceGrosir = item.priceGrosir;
      if(item.stock !== null) p.stock = (p.stock || 0) + item.stock; // update = tambah stok (restock), bukan menimpa
    }
  });
  persistProducts();
  const addedCount = plan.toAdd.length, updatedCount = plan.toUpdate.length, skippedCount = plan.skipped;
  closeModal();
  showAlert('Impor selesai: ' + addedCount + ' produk baru, ' + updatedCount + ' diperbarui' + (skippedCount ? ', ' + skippedCount + ' baris dilewati' : '') + '.');
}

async function saveUser(id){
  if(!sb){ showAlert('Gak ada koneksi ke server, coba lagi kalau internet sudah nyambung.'); return; }
  const name = document.getElementById('uf-name').value.trim();
  const pin = document.getElementById('uf-pin').value.trim();
  if(!name){ showAlert('Nama kasir wajib diisi'); return; }
  if(id===null && !/^\d{4}$/.test(pin)){ showAlert('PIN harus 4 digit angka'); return; }
  if(pin && !/^\d{4}$/.test(pin)){ showAlert('PIN harus 4 digit angka'); return; }
  if(id!==null){
    const target = users.find(u=>u.id===id);
    if(target && target.name==='Admin' && name!=='Admin'){
      showAlert('Akun "Admin" gak boleh diganti nama. Kalau namanya diubah, menu Riwayat & Kasir Toko bakal terkunci total (termasuk buat kamu sendiri) dan gak ada jalan buka lagi dari dalam app.');
      return;
    }
  }
  try{
    if(id===null){
      const { data: newId, error } = await sb.rpc('kk_add_staff', { p_name: name, p_pin: pin });
      if(error) throw error;
    } else {
      const { error } = await sb.rpc('kk_update_staff', { p_id: id, p_name: name, p_pin: pin || null });
      if(error) throw error;
      if(session && session.id===id) { session.name = name; persistSession(); }
    }
    await refreshStaffNames();
    closeModal();
    render();
  }catch(e){
    console.warn('Gagal simpan kasir:', e);
    showAlert('Gagal simpan: ' + (e && e.message ? e.message : e));
  }
}
function deleteUser(id){
  if(users.length<=1){ showAlert('Minimal harus ada 1 akun kasir.'); return; }
  const target = users.find(u=>u.id===id);
  if(target && target.name==='Admin'){
    showAlert('Akun "Admin" gak boleh dihapus. Kalau terhapus, menu Riwayat & Kasir Toko bakal terkunci total dan gak ada jalan buka lagi dari dalam app.');
    return;
  }
  if(!sb){ showAlert('Gak ada koneksi ke server, coba lagi kalau internet sudah nyambung.'); return; }
  askConfirm('Hapus akun kasir ini?', async function(){
    const wasSelf = session && session.id===id;
    try{
      const { error } = await sb.rpc('kk_delete_staff', { p_id: id });
      if(error) throw error;
      await refreshStaffNames();
      render();
      if(wasSelf) doLogout();
    }catch(e){
      console.warn('Gagal hapus kasir:', e);
      showAlert('Gagal hapus: ' + (e && e.message ? e.message : e));
    }
  });
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function afterRender(){ renderQrisQrIfNeeded(); }

/* ============ INIT ============ */
function showFatalError(err){
  try{
    const msg = (err && err.message) ? err.message : String(err);
    const stack = (err && err.stack) ? err.stack : '';
    document.body.innerHTML = `
      <div style="max-width:480px; margin:0 auto; padding:28px 22px; font-family:sans-serif; color:#241C10; background:#FBF3DE; min-height:100vh;">
        <h2 style="color:#C0392B; margin-bottom:10px;">Aplikasi gagal dimuat</h2>
        <p style="font-size:14px; line-height:1.6;">Terjadi error teknis saat membuka aplikasi. Silakan screenshot pesan di bawah ini dan kirim ke pembuat aplikasi supaya bisa diperbaiki.</p>
        <div style="background:#fff; border:1px solid #eee; border-radius:10px; padding:14px; margin-top:14px; font-family:monospace; font-size:12.5px; white-space:pre-wrap; word-break:break-word;">${String(msg).replace(/</g,'&lt;')}</div>
        <details style="margin-top:12px; font-size:11.5px; color:#5B4E37;"><summary>Detail teknis</summary><pre style="white-space:pre-wrap; word-break:break-word;">${String(stack).replace(/</g,'&lt;')}</pre></details>
        <p style="font-size:12.5px; color:#5B4E37; margin-top:16px;">Coba juga: buka file ini pakai aplikasi Chrome (bukan browser bawaan lain), pastikan file tidak rusak saat diunduh, dan coba di HP/koneksi lain.</p>
      </div>`;
  }catch(e2){ /* last resort: leave whatever is on screen */ }
}
window.onerror = function(message, source, lineno, colno, error){
  showFatalError(error || message);
  return true;
};
try{
  render();
  if(isAdmin()){ requestNotifPermission(); requestWakeLock(); }
  if(SYNC_ENABLED){ syncPull().then(subscribeRealtime); }
}catch(err){
  showFatalError(err);
}
